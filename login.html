<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaFlow — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <img class="login-logo" src="/assets/linguaflow-logo.svg" alt="LinguaFlow" />
        <p class="eyebrow">Внутренний сервис</p>
        <h1 id="login-title">Вход в сервис</h1>
        <p class="lead">Войдите, чтобы переводить документы.</p>
        <form id="login-form">
          <label>Имя пользователя<input id="username" autocomplete="username" required autofocus /></label>
          <label>Пароль<input id="password" type="password" autocomplete="current-password" required /></label>
          <p id="login-message" role="alert"></p>
          <button type="submit">Войти <span>→</span></button>
        </form>
      </section>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const message = document.getElementById('login-message');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.textContent = '';
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username.value, password: password.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Не удалось выполнить вход.');
          window.location.assign('/');
        } catch (error) {
          message.textContent = error.message;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
